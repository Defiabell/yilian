<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>找不到这一页 · 一练</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111419" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon-512.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap">
<style>
  /* Same tokens as index.html; this page is served by Cloudflare Pages with a real 404 status. */
  :root {
    --bg: #f2f3f5; --fg: #171b21; --muted: #5f6974; --line: #d9dde3; --accent: #d84e1c;
    --display: "Barlow Condensed", "Arial Narrow", "PingFang SC", sans-serif;
    --body: -apple-system, "PingFang SC", "Helvetica Neue", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111419; --fg: #eef0f3; --muted: #99a2ad; --line: #2c323b; --accent: #ff7b47; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; margin: 0; padding: 0 16px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 0; }
  .code { font-family: var(--display); font-size: 72px; font-weight: 700; line-height: 1; color: var(--accent); margin: 0; letter-spacing: 0.02em; }
  h1 { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1.05; margin: 12px 0 0; }
  p { margin: 10px 0 0; color: var(--muted); }
  a.back { display: inline-block; margin-top: 24px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--fg); text-decoration: none; font-weight: 600; }
  a.back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="code">404</p>
  <h1>找不到这一页</h1>
  <p>地址可能打错了，或者这一页已经不在了。计划本身只有一页。</p>
  <a class="back" href="/">回到训练计划</a>
</div>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一练 · 四练上下肢计划</title>
<meta name="description" content="每周四练的上下肢分化训练计划：动作示意图、组数次数、要点、勾选和组间计时。">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111419" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="一练">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-512.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  /* Layout: one column phone-first; sticky day tabs on top, sticky rest timer at the bottom, picture-first exercise cards in between. */
  :root {
    --bg: #f2f3f5;
    --surface: #ffffff;
    --surface-2: #e9ebee;
    --fg: #171b21;
    --muted: #5f6974;
    --line: #d9dde3;
    --accent: #d84e1c;
    --accent-ink: #ffffff;
    --accent-soft: #fbe8df;
    --ok: #1f8a4c;
    --ok-soft: #e0f3e8;
    --display: "Barlow Condensed", "Arial Narrow", "PingFang SC", sans-serif;
    --body: -apple-system, "PingFang SC", "Helvetica Neue", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111419; --surface: #1b1f26; --surface-2: #252a33; --fg: #eef0f3; --muted: #99a2ad;
      --line: #2c323b; --accent: #ff7b47; --accent-ink: #1a0d06; --accent-soft: #3b2117;
      --ok: #4ccb7f; --ok-soft: #173426; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111419; --surface: #1b1f26; --surface-2: #252a33; --fg: #eef0f3; --muted: #99a2ad;
    --line: #2c323b; --accent: #ff7b47; --accent-ink: #1a0d06; --accent-soft: #3b2117;
    --ok: #4ccb7f; --ok-soft: #173426; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body);
    font-size: 15px; line-height: 1.5; margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 110px;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .wrap { max-width: 560px; margin: 0 auto; }

  header { padding: 20px 0 12px; }
  header h1 { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1.05; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

  .tabs {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg); padding: 8px 0 10px;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  .tab {
    appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    border-radius: 10px; padding: 8px 2px; font: inherit; font-size: 13px; line-height: 1.2; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0;
  }
  .tab small { font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
  .tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tab[aria-selected="true"] small { color: var(--accent); }
  .tab:focus-visible, .check:focus-visible, .reset:focus-visible, .more:focus-visible, .frame:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 0 10px; }
  .day-head h2 { font-family: var(--display); font-size: 26px; font-weight: 700; margin: 0; line-height: 1.1; }
  .day-head h2 span { color: var(--accent); margin-left: 6px; }
  .day-head .meta { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
  .reset { appearance: none; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .progress { height: 4px; background: var(--surface-2); border-radius: 2px; margin: 0 0 12px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .25s; }

  .list { display: grid; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .card.extra { border-style: dashed; }

  /* 两帧动图 */
  .frame { position: relative; width: 100%; aspect-ratio: 3 / 2; max-width: 100%; background: var(--surface-2); cursor: pointer; -webkit-tap-highlight-color: transparent; overflow: hidden; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; max-width: 100%; transition: opacity .35s; }
  .frame img.b { opacity: 0; }
  .frame.alt img.b { opacity: 1; }
  .frame .dots { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 5px; }
  .frame .dots i { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .45; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .frame .dots i.on { opacity: 1; }
  .frame .lbl { position: absolute; right: 10px; bottom: 6px; font-family: var(--display); font-size: 13px; letter-spacing: .08em; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .frame .n { position: absolute; left: 10px; top: 8px; font-family: var(--display); font-size: 20px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); line-height: 1; }
  .card.done .frame { opacity: .5; }

  .head { display: grid; grid-template-columns: 1fr auto 34px; gap: 10px; align-items: center; padding: 10px 12px 8px 12px; }
  .head .body { min-width: 0; }
  .head .name { font-weight: 600; font-size: 17px; line-height: 1.3; }
  .head .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .head .sets { font-family: var(--display); font-size: 32px; font-weight: 700; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
  .head .sets b { font-size: 16px; font-weight: 600; color: var(--muted); margin: 0 3px; }
  .head .sets em { display: block; font-style: normal; font-family: var(--body); font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 3px; }
  .mus { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .mus b, .mus i { font-style: normal; font-weight: 500; font-size: 11px; line-height: 1.4; border-radius: 6px; padding: 1px 7px; }
  .mus b { background: var(--fg); color: var(--bg); }
  .mus i { border: 1px solid var(--line); color: var(--muted); }
  .vol { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; margin: 8px 0 6px; }
  .vol .g { font-weight: 600; white-space: nowrap; }
  .vol .bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; position: relative; min-width: 0; }
  .vol .bar b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fg); border-radius: 5px; }
  .vol .bar i { position: absolute; top: 0; bottom: 0; background: var(--line); }
  .vol .num { font-family: var(--display); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .vol .num small { font-family: var(--body); font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 3px; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; background: var(--fg); }
  .legend span.s::before { background: var(--line); }
  .check {
    appearance: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface);
    color: transparent; font-size: 16px; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0; justify-self: end;
  }
  .card.done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
  .card.done .name { color: var(--muted); text-decoration: line-through; }

  .cues { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
  .cues span { background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 3px 10px; font-size: 13px; line-height: 1.5; }
  .cues .more { appearance: none; background: none; border: 1px dashed var(--line); color: var(--muted); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 13px; cursor: pointer; }

  .how { border-top: 1px solid var(--line); padding: 10px 12px 12px 12px; display: grid; gap: 8px; font-size: 14px; }
  .how[hidden] { display: none; }
  .how .row { display: grid; grid-template-columns: 34px 1fr; gap: 8px; }
  .how .k { font-family: var(--display); font-size: 15px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); padding-top: 2px; }
  .how ol, .how ul { margin: 0; padding-left: 16px; }
  .how li { margin-bottom: 3px; }
  .how .tip { background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }

  /* 说明 */
  .notes h3 { font-family: var(--display); font-size: 22px; font-weight: 700; margin: 18px 0 8px; }
  .notes h3:first-child { margin-top: 8px; }
  .notes p { margin: 0 0 8px; }
  .notes ul { margin: 0; padding-left: 18px; }
  .notes li { margin-bottom: 4px; }
  .notes .src { color: var(--muted); font-size: 12px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 8px 0 4px; }
  .week div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 2px; text-align: center; font-size: 12px; min-width: 0; }
  .week div small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .week div.on { background: var(--accent-soft); border-color: transparent; font-weight: 600; }
  .week div.on b { color: var(--accent); font-family: var(--display); font-size: 16px; }
  .week div.off { color: var(--muted); }
  .signals { display: grid; gap: 6px; }
  .signals div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; }

  /* 组间计时 */
  .timer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .timer .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .timer .btns { display: flex; gap: 6px; }
  .timer button { appearance: none; font: inherit; border-radius: 10px; cursor: pointer; padding: 9px 0; flex: 1; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-weight: 600; }
  .timer button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .timer .stop { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .timer .clock { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1; min-width: 72px; text-align: right; font-variant-numeric: tabular-nums; }
  .timer .clock small { display: block; font-family: var(--body); font-size: 10px; color: var(--muted); font-weight: 400; letter-spacing: 0.08em; margin-bottom: 2px; }
  .timer .clock.run { color: var(--accent); }
  .timer .clock.over { color: var(--ok); }
  @media (prefers-reduced-motion: reduce) { .progress i, .frame img { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>四练上下肢计划</h1>
    <p>每周 4 练，上下肢分化，每个部位一周两次。图片在起始和结束两个姿势间自动切换，点图可暂停。动作名下面深色标签是主练部位，描边的是辅助部位。</p>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section id="panel"></section>
</div>

<div class="timer">
  <div class="in">
    <div class="btns" id="timerBtns">
      <button type="button" data-s="60">60 秒</button>
      <button type="button" data-s="90">90 秒</button>
      <button type="button" data-s="180">3 分钟</button>
    </div>
    <div class="clock" id="clock"><small>组间休息</small>0:00</div>
  </div>
</div>

<script>
  /* 动作库：img 两帧图片前缀；cues 三条最短要点；prep / move / watch 是展开后的完整文字 */
  const EX = {
    bench: { n: '杠铃卧推', eq: '卧推架', img: 'Barbell_Bench_Press_-_Medium_Grip', pri: ['胸'], sec: ['三头', '肩前束'],

      prep: ['躺平，眼睛在杠的正下方，双脚踩实地面', '肩胛骨往后夹、往下沉，整个过程不松', '握距比肩宽一掌，手腕保持直的'],
      move: ['杠下放到胸中下部，手肘和身体夹角 45 到 75 度', '轻触胸停一下', '沿略微斜向头的弧线推回到肩膀正上方'],
      watch: ['屁股不能离开凳子', '杠不要在胸上弹起来', '推起时肩膀不往前耸'] },
    latWide: { n: '高位下拉', eq: '宽握正握', img: 'Wide-Grip_Lat_Pulldown', pri: ['背阔肌'], sec: ['二头', '中背'],
      cues: ['肘往下往后拉', '拉到上胸', '不靠后仰借力'],
      prep: ['大腿卡在挡垫下面，脚踩实', '握距比肩宽一到两拳，身体往后仰 10 到 20 度', '先把肩胛骨往下沉，再开始拉'],
      move: ['手肘往下、往后带，把杠拉到上胸', '顶点肩胛骨往中间夹，停一秒', '慢慢放回到手臂伸直，肩膀不要被拉得耸起来'],
      watch: ['不要用身体后仰借力', '想着用手肘拉，不是用手', '放回去比拉的时候慢'],
      tip: '引体向上的替代动作。重量能拉到自己体重八成时再去试引体。' },
    latClose: { n: '高位下拉', eq: '窄握对握 · V 把', img: 'Close-Grip_Front_Lat_Pulldown', pri: ['背阔肌'], sec: ['二头'],
      cues: ['肘贴身往下', '拉到上胸', '不耸肩'],
      prep: ['V 把，两手掌心相对', '大腿卡稳，身体微后仰，肩胛骨先往下沉'],
      move: ['手肘贴着身体往下拉，把把手拉到上胸', '顶点停一秒', '慢放到手臂伸直'],

      cues: ['肘贴身拉到肚脐', '顶点夹背', '腰不摆'],

      move: ['手肘贴着身体往后拉到肚脐附近', '顶点挺胸，肩胛骨夹紧，停一秒', '慢慢放回去，让肩胛骨跟着往前伸'],

      prep: ['哑铃在身体两侧，手肘微屈并保持', '躯干微微前倾一点'],

      cues: ['屁股贴垫', '放到膝 90 度', '顶点不锁膝'],

  function weeklyVolume() {
    const v = {};

      ex.pri.forEach(m => { const g = GROUP[m]; if (seen.has(g)) return; seen.add(g); v[g] = v[g] || { d: 0, i: 0 }; v[g].d += sets; });
      ex.sec.forEach(m => { const g = GROUP[m]; if (seen.has(g)) return; seen.add(g); v[g] = v[g] || { d: 0, i: 0 }; v[g].i += sets; });

    const max = Math.max.apply(null, Object.values(v).map(x => x.d + x.i));

      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination); o.frequency.value = 880; g.gain.value = 0.15;
      o.start(); o.stop(ac.currentTime + 0.35);
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  function stop() { clearInterval(timer); timer = null; btns.innerHTML = BTNS; setClock('0:00', ''); }
  function start(sec) {
    clearInterval(timer);
    endAt = Date.now() + sec * 1000;
    btns.innerHTML = '<button type="button" class="stop" data-stop="1">停止</button>';
    const tick = () => {
      const left = (endAt - Date.now()) / 1000;
      if (left <= 0) { clearInterval(timer); timer = null; setClock('开始', 'over'); beep(); btns.innerHTML = BTNS; return; }
      setClock(fmt(left), 'run');
    };
    tick(); timer = setInterval(tick, 250);
  }
  btns.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.stop) stop(); else start(Number(b.dataset.s));
  });
</script>
</body>
